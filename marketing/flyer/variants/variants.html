<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Estate Tea · Brew flyer variants</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:210mm; height:297mm; }
  body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  :root { --bg:#070606; --ink:#EDE6D8; --sub:#A79E8E; --gold:#C9A04E; --gold-soft:#E3C27A; --qrbg:#F4EFE3; }
  body.light { --bg:#F3EDE2; --ink:#1A1612; --sub:#6E6455; --gold:#A87E2E; --gold-soft:#9A7226; --qrbg:#FFFFFF; }
  .page { position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--bg); color:var(--ink); }
  .cinzel { font-family:Cinzel, serif; }
  .corm { font-family:"Cormorant Garamond", serif; }
  .gold { color:var(--gold-soft); }
  .wa svg { stroke:var(--gold); }
  .qr { background:var(--qrbg); }
  .qr img { width:100%; height:100%; display:block; }
  .rule { width:22mm; height:.3mm; background:var(--gold); opacity:.7; }

  /* ---------- A: centred ---------- */
  .A .glow { position:absolute; inset:0; background:radial-gradient(ellipse 70% 40% at 50% 58%, rgba(201,160,78,.10), transparent 70%); }
  .A .col { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:16mm 0 14mm; }
  .A .logo { width:30mm; }
  .A .l1 { margin-top:9mm; font-size:11pt; letter-spacing:.36em; }
  .A .l2 { margin-top:4mm; font-size:30pt; font-weight:500; letter-spacing:.18em; }
  .A .hero { margin:4mm 0 6mm; flex:1; min-height:0; display:flex; justify-content:center; }
  .A .hero img { height:100%; }
  .A .bottom { display:flex; align-items:center; gap:9mm; }
  .A .qr { width:30mm; height:30mm; padding:2.2mm; }
  .A .offer { text-align:left; }
  .A .offer b { display:block; font-size:24pt; font-weight:500; line-height:1; }
  .A .offer span { display:block; margin-top:2mm; font-size:7.6pt; letter-spacing:.26em; line-height:1.7; }
  .A .offer small { display:flex; align-items:center; gap:2mm; margin-top:3mm; font-size:11pt; letter-spacing:.06em; color:var(--sub); }
  .A .offer small svg { width:5.5mm; height:5.5mm; }
  .A .foot { margin-top:6mm; font-size:10.5pt; letter-spacing:.18em; color:var(--sub); }

  body.light .A .hero img { border-radius:3mm; box-shadow:0 6mm 14mm rgba(0,0,0,.18); }
  /* ---------- B: split ---------- */
  .B .left { position:absolute; left:0; top:0; bottom:0; width:56%; }
  .B .left { display:flex; align-items:center; justify-content:center; }
  .B .left img { height:175mm; margin-left:10mm; }
  .B .right { position:absolute; right:16mm; top:0; bottom:0; width:74mm; display:flex; flex-direction:column; justify-content:center; }
  .B .logo { width:24mm; }
  .B .l1 { margin-top:12mm; font-size:10pt; letter-spacing:.34em; line-height:1.9; }
  .B .l2 { margin-top:5mm; font-size:27pt; font-weight:500; letter-spacing:.14em; line-height:1.25; }
  .B .rule { margin-top:9mm; }
  .B .offer { margin-top:9mm; }
  .B .offer b { font-size:24pt; font-weight:500; }
  .B .offer span { display:block; margin-top:1.5mm; font-size:7.6pt; letter-spacing:.26em; }
  .B .qr { margin-top:10mm; width:34mm; height:34mm; padding:2.4mm; }
  .B .scan { margin-top:3.5mm; display:flex; align-items:center; gap:2mm; font-size:11pt; letter-spacing:.06em; color:var(--sub); }
  .B .scan svg { width:5.5mm; height:5.5mm; }
  .B .foot { position:absolute; right:16mm; bottom:13mm; width:74mm; font-size:10pt; letter-spacing:.16em; color:var(--sub); }

  /* ---------- C: type-led ---------- */
  .C .col { position:absolute; left:18mm; right:18mm; top:18mm; bottom:16mm; display:flex; flex-direction:column; }
  .C .head { display:flex; align-items:center; gap:4mm; }
  .C .head img { width:13mm; }
  .C .head span { font-size:10pt; letter-spacing:.42em; }
  .C h1 { margin-top:14mm; font-size:40pt; font-weight:500; letter-spacing:.06em; line-height:1.12; }
  .C .sub { margin-top:6mm; font-size:15pt; letter-spacing:.04em; color:var(--sub); }
  .C .hero { flex:1; min-height:0; display:flex; justify-content:flex-end; margin-right:-10mm; }
  .C .hero img { height:100%; }
  .C .bottom { display:flex; align-items:flex-end; justify-content:space-between; border-top:.3mm solid rgba(201,160,78,.45); padding-top:6mm; }
  .C .offer b { font-size:22pt; font-weight:500; }
  .C .offer span { display:block; margin-top:1mm; font-size:7.6pt; letter-spacing:.26em; }
  .C .offer small { display:block; margin-top:3mm; font-size:10.5pt; letter-spacing:.12em; color:var(--sub); }
  .C .qrwrap { display:flex; align-items:center; gap:4mm; }
  .C .qrwrap .t { text-align:right; font-size:10.5pt; letter-spacing:.08em; color:var(--sub); line-height:1.5; }
  .C .qr { width:30mm; height:30mm; padding:2.2mm; }
</style>
</head>
<body>
<script>
const v = (new URLSearchParams(location.search).get('v') || 'A').toUpperCase();
if (v === 'D') document.body.classList.add('light');
const layout = v === 'D' ? 'A' : v;
const logo = v === 'D' ? 'logo-antique.png' : 'logo-antique.png';
const WA = '<svg viewBox="0 0 32 32" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5a12.5 12.5 0 0 0-10.8 18.8L3.5 28.5l6.4-1.7A12.5 12.5 0 1 0 16 3.5z"/><path d="M11.6 9.6c.4-.4 1.1-.4 1.5 0l1.4 2.3c.3.5.2 1.1-.2 1.5l-.8.8c.9 1.9 2.4 3.4 4.3 4.3l.8-.8c.4-.4 1-.5 1.5-.2l2.3 1.4c.4.4.4 1.1 0 1.5l-1 1.1c-.8.8-2 1-3 .6a13.6 13.6 0 0 1-7.8-7.8c-.4-1-.2-2.2.6-3z"/></svg>';
const pack = v === 'D' ? 'pack-light.png' : 'pack-close.png';
const html = {
A: `<div class="page A"><div class="glow"></div><div class="col">
      <img class="logo" src="${logo}" alt="Estate Tea">
      <div class="l1 cinzel">PREMIUM TEA · EVERYDAY PRICE</div>
      <div class="l2 cinzel">ORDER WITH <span class="gold">BREW</span></div>
      <div class="hero"><img src="${pack}" alt=""></div>
      <div class="bottom">
        <div class="qr"><img src="qr.svg" alt=""></div>
        <div class="offer cinzel"><b class="gold">10% OFF</b><span>YOUR FIRST ORDER</span>
          <small class="corm wa">${WA} Scan to chat on WhatsApp</small></div>
      </div>
      <div class="foot corm">Free delivery to Golden Palms</div>
    </div></div>`,
B: `<div class="page B">
      <div class="left"><img src="${v === 'D' ? pack : 'pack.png'}" alt=""></div>
      <div class="right">
        <img class="logo" src="${logo}" alt="Estate Tea">
        <div class="l1 cinzel">PREMIUM TEA<br>EVERYDAY PRICE</div>
        <div class="l2 cinzel">ORDER<br>WITH <span class="gold">BREW</span></div>
        <div class="rule"></div>
        <div class="offer cinzel"><b class="gold">10% OFF</b><span>YOUR FIRST ORDER</span></div>
        <div class="qr"><img src="qr.svg" alt=""></div>
        <div class="scan corm wa">${WA} Scan to chat on WhatsApp</div>
      </div>
      <div class="foot corm">Free delivery to Golden Palms</div>
    </div>`,
C: `<div class="page C"><div class="col">
      <div class="head"><img src="${logo}" alt=""><span class="cinzel gold">ESTATE TEA</span></div>
      <h1 class="cinzel">Premium tea.<br><span class="gold">Everyday price.</span></h1>
      <div class="sub corm">Order on WhatsApp with Brew, your tea concierge.</div>
      <div class="hero"><img src="${pack}" alt=""></div>
      <div class="bottom">
        <div class="offer cinzel"><b class="gold">10% OFF</b><span>YOUR FIRST ORDER</span><small class="corm">Free delivery to Golden Palms</small></div>
        <div class="qrwrap"><div class="t corm">Scan to chat<br>with Brew</div><div class="qr"><img src="qr.svg" alt=""></div></div>
      </div>
    </div></div>`,
}[layout];
document.write(html);
</script>
</body>
</html>
