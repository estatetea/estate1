<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Estate Tea · Brew flyer</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#070606; --ink:#EDE6D8; --sub:#A79E8E; --gold:#C9A04E; --gold-soft:#E3C27A; }
  html, body { width:210mm; height:297mm; background:var(--bg); }
  body { color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page { position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--bg); }
  .cinzel { font-family:Cinzel, serif; } .corm { font-family:"Cormorant Garamond", serif; }
  .gold { color:var(--gold-soft); }

  /* full-bleed photo, no feathered corners: a straight fade into black at the top only */
  .photo { position:absolute; left:0; right:0; top:70mm; height:210mm; background:url(photo-bg.jpg) center/cover; }
  .photo::before { content:""; position:absolute; left:0; right:0; top:0; height:55mm; background:linear-gradient(var(--bg), rgba(7,6,6,0)); }
  .photo::after { content:""; position:absolute; left:0; right:0; bottom:0; height:70mm; background:linear-gradient(rgba(7,6,6,0), rgba(7,6,6,.72) 55%, rgba(7,6,6,.9)); }
  .base { position:absolute; left:0; right:0; top:280mm; bottom:0; background:rgba(7,6,6,.9); }
  .grain { position:absolute; inset:0; background:url(grain.png); background-size:60mm; mix-blend-mode:overlay; opacity:.9; pointer-events:none; }
  .frame { position:absolute; inset:7mm; border:.25mm solid rgba(201,160,78,.38); pointer-events:none; }

  .top { position:absolute; left:0; right:0; top:15mm; text-align:center; }
  .logo { width:24mm; }
  .word { margin-top:3mm; font-size:17pt; font-weight:500; letter-spacing:.42em; margin-right:-.42em; }
  .rule { margin:5.5mm auto 0; display:flex; align-items:center; justify-content:center; gap:3mm; }
  .rule i { display:block; width:16mm; height:.25mm; background:var(--gold); opacity:.75; }
  .rule b { width:1.4mm; height:1.4mm; background:var(--gold); transform:rotate(45deg); }
  .l1 { margin-top:5.5mm; font-size:11pt; letter-spacing:.36em; margin-right:-.36em; }
  .l2 { margin-top:3.5mm; font-size:30pt; font-weight:500; letter-spacing:.18em; margin-right:-.18em; }
  .brew { margin-top:3mm; font-size:14pt; font-style:italic; color:var(--sub); letter-spacing:.02em; }
  .brew em { font-style:normal; color:var(--ink); }

  .bottom { position:absolute; left:0; right:0; bottom:20mm; display:flex; justify-content:center; align-items:center; gap:8mm; }
  .qr { width:29mm; height:29mm; padding:2.1mm; background:#F4EFE3; }
  .qr img { width:100%; height:100%; display:block; }
  .offer b { display:block; font-size:24pt; font-weight:500; line-height:1; }
  .offer span { display:block; margin-top:2mm; font-size:7.6pt; letter-spacing:.26em; }
  .offer small { display:flex; align-items:center; gap:2mm; margin-top:3.2mm; font-size:11pt; letter-spacing:.04em; color:var(--sub); }
  .offer small svg { width:5mm; height:5mm; stroke:var(--gold); }
  .foot { position:absolute; left:0; right:0; bottom:11mm; text-align:center; font-size:10.5pt; letter-spacing:.18em; color:var(--sub); }
</style>
</head>
<body>
<div class="page">
  <div class="photo"></div>
  <div class="grain"></div>
  <div class="frame"></div>

  <div class="top">
    <img class="logo" src="logo-antique.png" alt="">
    <div class="word cinzel gold">ESTATE TEA</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="l1 cinzel">PREMIUM TEA · EVERYDAY PRICE</div>
    <div class="l2 cinzel">ORDER WITH <span class="gold">BREW</span></div>
    <div class="brew corm">Meet <em>Brew</em>, our tea concierge on WhatsApp. Ask, order and pay in one chat.</div>
  </div>

  <div class="bottom">
    <div class="qr"><img src="qr.svg" alt="Chat with Brew on WhatsApp"></div>
    <div class="offer cinzel"><b class="gold">10% OFF</b><span>YOUR FIRST ORDER</span>
      <small class="corm"><svg viewBox="0 0 32 32" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5a12.5 12.5 0 0 0-10.8 18.8L3.5 28.5l6.4-1.7A12.5 12.5 0 1 0 16 3.5z"/><path d="M11.6 9.6c.4-.4 1.1-.4 1.5 0l1.4 2.3c.3.5.2 1.1-.2 1.5l-.8.8c.9 1.9 2.4 3.4 4.3 4.3l.8-.8c.4-.4 1-.5 1.5-.2l2.3 1.4c.4.4.4 1.1 0 1.5l-1 1.1c-.8.8-2 1-3 .6a13.6 13.6 0 0 1-7.8-7.8c-.4-1-.2-2.2.6-3z"/></svg>Scan to chat with Brew</small></div>
  </div>
  <div class="foot corm">Free delivery to Golden Palms</div>
</div>
</body>
</html>
